name: ciphershelf

services:
  ciphershelf:
    build: .
    image: ciphershelf:latest
    container_name: ciphershelf
    restart: unless-stopped
    environment:
      VAULT_ROOT: /data        # 加解密操作的根目录
      PORT: "8080"
      # 生产 HTTPS 反向代理下改为 "1"；直接 HTTP 调试必须保持 "0"。
      SVAULT_COOKIE_SECURE: "0"
    ports:
      # 安全默认值：仅本机访问。需要局域网访问时请先配置 HTTPS 反向代理。
      - "127.0.0.1:6070:8080"
    volumes:
      # 把要操作的 NAS 目录挂到 /data（可挂整个数据盘，或按需挂具体目录）
      - /vol1/1000/appData:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
