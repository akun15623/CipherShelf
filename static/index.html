<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文件夹加解密</title>
  <link rel="stylesheet" href="/static/element-plus.css">
  <style>
    :root {
      --bg: #0f1420;
      --card: #1a2130;
      --card-hover: #232b3d;
      --border: #262f42;
      --text: #e6e8ee;
      --text-dim: #8a93a6;
      --accent: #409eff;
      --danger: #f56c6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    /* ============ 解锁界面 ============ */
    .lock-wrap { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    .lock-card {
      width: 100%; max-width: 400px; background: var(--card); border-radius: 16px;
      padding: 40px 32px; text-align: center;
    }
    .lock-icon { font-size: 52px; margin-bottom: 8px; }
    .lock-title { font-size: 21px; font-weight: 700; margin-bottom: 4px; }
    .lock-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }
    .lock-input { font-size: 16px !important; }

    /* ============ 主布局（上下结构） ============ */
    .app { display: flex; flex-direction: column; height: 100vh; }

    .topbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: var(--card); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar .title { font-size: 16px; font-weight: 700; flex: 1; }

    .tree-wrap {
      flex: 1; overflow-y: auto; padding: 12px 16px;
      /* 预留底部操作栏高度（移动端固定） */
    }
    .tree-inner { max-width: 900px; margin: 0 auto; }

    /* el-tree 自定义 */
    .el-tree { background: transparent; color: var(--text); }
    .el-tree-node__content { height: 40px; border-radius: 8px; }
    .el-tree-node__content:hover { background: var(--card-hover); }
    .tree-node { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; padding-right: 4px; }
    .tree-node .icon { flex-shrink: 0; font-size: 16px; }
    .tree-node .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .tree-node .lock { flex-shrink: 0; font-size: 13px; }
    .tree-node .size { flex-shrink: 0; color: var(--text-dim); font-size: 11px; }

    /* ============ 底部操作栏 ============ */
    .bottombar {
      flex-shrink: 0;
      padding: 12px 16px;
      background: var(--card);
      border-top: 1px solid var(--border);
    }
    .bottombar-inner { max-width: 900px; margin: 0 auto; }
    .progress-row { margin-bottom: 10px; }
    .progress-meta { font-size: 12px; color: var(--text-dim); margin-top: 4px; text-align: center; }
    .btn-row { display: flex; gap: 10px; }
    .btn-row .el-button { flex: 1; }

    @media (max-width: 768px) {
      .bottombar {
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
        background: rgba(26, 33, 48, 0.9);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .tree-wrap { padding-bottom: 140px; }
      .el-tree-node__content { height: 44px; }
      .btn-row .el-button { height: 48px; font-size: 15px; }
      .topbar .title { font-size: 15px; }
      .lock-input input { font-size: 16px !important; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/static/vue.global.prod.js"></script>
<script src="/static/element-plus.full.min.js"></script>
<script>
if (typeof Vue === 'undefined' || typeof ElementPlus === 'undefined') {
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f56c6c;">前端资源加载失败</div>';
  throw new Error('frontend libs not loaded');
}

const { createApp, ref, onMounted } = Vue;
const { ElMessage } = ElementPlus;

const TEMPLATE = `
  <div v-if="!unlocked" class="lock-wrap">
    <div class="lock-card">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">{{ initialized === false ? '创建密码' : '文件夹加解密' }}</div>
      <div class="lock-sub">{{ initialized === false ? '首次使用：设置一个密码作为加解密密钥' : '输入密码进入（密码即加解密密钥）' }}</div>

      <template v-if="initialized === false">
        <el-input v-model="password" type="password" show-password size="large" class="lock-input"
                  placeholder="设置密码（至少 8 位）" @keyup.enter="doUnlock" />
        <el-input v-model="confirmPassword" type="password" show-password size="large" class="lock-input"
                  style="margin-top:12px;" placeholder="再次确认密码" @keyup.enter="doUnlock" />
        <el-button type="primary" size="large" style="width:100%;margin-top:18px;height:48px;"
                   :loading="busy" @click="doUnlock">创建并进入</el-button>
      </template>

      <template v-else-if="initialized === true">
        <el-input v-model="password" type="password" show-password size="large" class="lock-input"
                  placeholder="密码" @keyup.enter="doUnlock" />
        <el-button type="primary" size="large" style="width:100%;margin-top:18px;height:48px;"
                   :loading="busy" @click="doUnlock">进入</el-button>
      </template>

      <div v-else style="color:var(--text-dim);padding:16px 0;">加载中…</div>

      <div v-if="err" style="color:var(--danger);font-size:13px;margin-top:12px;">{{ err }}</div>
      <div style="color:var(--text-dim);font-size:12px;margin-top:16px;line-height:1.6;">
        ⚠️ 密码是唯一密钥，忘记将无法解密已加密的文件。
      </div>
    </div>
  </div>

  <div v-else class="app">
    <div class="topbar">
      <span class="title">🔐 文件夹加解密</span>
      <el-button size="small" @click="doLock">锁定</el-button>
    </div>

    <div class="tree-wrap">
      <div class="tree-inner">
        <el-tree
          ref="treeRef"
          :data="treeData"
          :props="treeProps"
          :load="loadNode"
          lazy
          show-checkbox
          node-key="path"
          :default-expanded-keys="['']"
          @check="onCheck"
        >
          <template #default="{ node, data }">
            <div class="tree-node">
              <span class="icon">{{ data.type === 'dir' ? '📁' : '📄' }}</span>
              <span class="label">{{ data.name }}</span>
              <span v-if="data.encrypted" class="lock" title="已加密">🔒</span>
              <span v-if="data.type === 'file'" class="size">{{ fmtSize(data.size) }}</span>
            </div>
          </template>
        </el-tree>
        <div v-if="treeEmpty" class="empty" style="text-align:center;color:var(--text-dim);padding:40px 0;">
          暂无内容
        </div>
      </div>
    </div>

    <div class="bottombar">
      <div class="bottombar-inner">
        <div class="progress-row" v-if="progress && progress.status === 'running'">
          <el-progress :percentage="progress.percent" :stroke-width="12" />
          <div class="progress-meta">{{ progress.current }} · {{ fmtSize(progress.done) }} / {{ fmtSize(progress.total) }}</div>
        </div>
        <div class="btn-row">
          <el-button type="primary" :disabled="!encryptSel.length" @click="doEncrypt">
            🔒 加密选中{{ encryptSel.length ? ' (' + encryptSel.length + ')' : '' }}
          </el-button>
          <el-button type="warning" :disabled="!decryptSel.length" @click="doDecrypt">
            🔓 解密选中{{ decryptSel.length ? ' (' + decryptSel.length + ')' : '' }}
          </el-button>
        </div>
      </div>
    </div>
  </div>
`;

const app = createApp({
  template: TEMPLATE,
  setup() {
    const unlocked = ref(false);
    const initialized = ref(null);  // null=加载中, true=已初始化(输密码), false=首次(创建密码)
    const password = ref('');
    const confirmPassword = ref('');
    const busy = ref(false);
    const err = ref('');

    const treeRef = ref(null);
    const treeData = ref([{ name: '根目录', path: '', type: 'dir', encrypted: false }]);
    const treeProps = { label: 'name', children: 'children', isLeaf: 'isLeaf' };
    const treeEmpty = ref(false);

    const progress = ref(null);
    const encryptSel = ref([]);
    const decryptSel = ref([]);

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: 'include',
        headers: opts.body ? { 'Content-Type': 'application/json' } : {},
        ...opts,
      });
      if (res.status === 401) { unlocked.value = false; throw new Error('未解锁'); }
      if (!res.ok) {
        let detail = '请求失败';
        try { detail = (await res.json()).detail || detail; } catch (e) {}
        throw new Error(detail);
      }
      return res.json();
    }

    async function doUnlock() {
      err.value = '';
      if (!password.value) { err.value = '请输入密码'; return; }
      if (initialized.value === false) {
        if (password.value.length < 8) { err.value = '密码至少 8 位'; return; }
        if (password.value !== confirmPassword.value) { err.value = '两次输入的密码不一致'; return; }
      }
      busy.value = true;
      try {
        const body = initialized.value === false
          ? { password: password.value, password_confirmation: confirmPassword.value }
          : { password: password.value };
        await api('/api/unlock', { method: 'POST', body: JSON.stringify(body) });
        password.value = '';
        confirmPassword.value = '';
        unlocked.value = true;
        // 重新加载树
        setTimeout(() => {
          if (treeRef.value) {
            const root = treeRef.value.getNode('');
            if (root) root.loaded = false;
            treeRef.value.store && treeRef.value.store.setData(treeData.value);
          }
        }, 50);
      } catch (e) { err.value = e.message; }
      finally { busy.value = false; }
    }

    async function doLock() {
      try { await api('/api/lock', { method: 'POST' }); } catch (e) {}
      unlocked.value = false;
      progress.value = null;
      encryptSel.value = [];
      decryptSel.value = [];
      refreshStatus();
    }

    function refreshStatus() {
      initialized.value = null;
      fetch('/api/status').then(s => s.json())
        .then(d => { initialized.value = !!d.initialized; })
        .catch(() => { initialized.value = true; });
    }

    function addPath(n, parentPath) {
      const fullPath = parentPath ? parentPath + '/' + n.name : n.name;
      const out = { name: n.name, type: n.type, encrypted: !!n.encrypted, size: n.size, path: fullPath, isLeaf: n.type === 'file' };
      if (n.children && n.children.length) {
        out.children = n.children.map(c => addPath(c, fullPath));
      }
      return out;
    }

    async function loadNode(node, resolve) {
      const path = node.data ? node.data.path : '';
      try {
        const res = await api('/api/tree?path=' + encodeURIComponent(path));
        const nodes = res.nodes.map(n => addPath(n, path));
        if (path === '') treeEmpty.value = nodes.length === 0;
        resolve(nodes);
      } catch (e) {
        resolve([]);
      }
    }

    function onCheck() {
      // 收集 checked 目录，取"顶层"（父节点未 checked）避免重复
      const checked = (treeRef.value ? treeRef.value.getCheckedNodes() : []).filter(n => n.type === 'dir');
      const top = checked.filter(n => !checked.some(p => n.path.startsWith(p.path + '/')));
      encryptSel.value = top.filter(n => !n.encrypted && n.path !== '');
      decryptSel.value = top.filter(n => n.encrypted && n.path !== '');
    }

    async function doEncrypt() {
      if (!encryptSel.value.length) return;
      const paths = encryptSel.value.map(n => n.path);
      try {
        const r = await api('/api/encrypt', { method: 'POST', body: JSON.stringify({ paths }) });
        pollProgress(r.task_id, () => { encryptSel.value = []; decryptSel.value = []; });
      } catch (e) { ElMessage.error(e.message); }
    }

    async function doDecrypt() {
      if (!decryptSel.value.length) return;
      const paths = decryptSel.value.map(n => n.path);
      try {
        const r = await api('/api/decrypt', { method: 'POST', body: JSON.stringify({ paths }) });
        pollProgress(r.task_id, () => { encryptSel.value = []; decryptSel.value = []; });
      } catch (e) { ElMessage.error(e.message); }
    }

    function pollProgress(taskId, onDone) {
      progress.value = { status: 'running', percent: 0, done: 0, total: 0, current: '' };
      const timer = setInterval(async () => {
        try {
          const res = await api('/api/progress/' + taskId);
          progress.value = res;
          if (res.status === 'done' || res.status === 'error') {
            clearInterval(timer);
            if (res.status === 'error') { ElMessage.error(res.error); }
            else { ElMessage.success('完成'); }
            setTimeout(() => { progress.value = null; refreshTree(); }, 800);
            onDone && onDone();
          }
        } catch (e) { clearInterval(timer); }
      }, 500);
    }

    function refreshTree() {
      // 重置树为初始状态，重新懒加载
      if (treeRef.value) {
        treeRef.value.store && treeRef.value.store.setData(treeData.value);
        const root = treeRef.value.getNode('');
        if (root) root.loaded = false;
      }
    }

    function fmtSize(n) {
      if (n == null) return '';
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
      return (n / 1073741824).toFixed(2) + ' GB';
    }

    onMounted(() => {
      // 检查是否已解锁；未解锁则查询初始化状态决定锁屏形态
      fetch('/api/tree?path=', { credentials: 'include' }).then(r => {
        if (r.ok) { unlocked.value = true; initialized.value = true; }
        else { refreshStatus(); }
      }).catch(() => { refreshStatus(); });
    });

    return {
      unlocked, initialized, password, confirmPassword, busy, err,
      treeRef, treeData, treeProps, treeEmpty,
      progress, encryptSel, decryptSel,
      doUnlock, doLock, loadNode, onCheck, doEncrypt, doDecrypt, fmtSize,
    };
  },
});
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
