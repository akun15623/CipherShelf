<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保险箱 · Secure Vault</title>
  <link rel="stylesheet" href="/static/element-plus.css">
  <style>
    :root {
      --bg: #0f1420;
      --card: #1a2130;
      --card-hover: #232b3d;
      --border: #262f42;
      --text: #e6e8ee;
      --text-dim: #8a93a6;
      --accent: #409eff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============ 锁屏 ============ */
    .lock-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .lock-card { width: 100%; max-width: 400px; background: var(--card); border-radius: 16px; padding: 40px 32px; text-align: center; }
    .lock-icon { font-size: 56px; margin-bottom: 8px; }
    .lock-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .lock-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }

    /* ============ 主布局 ============ */
    .app-shell { display: flex; height: 100vh; }

    .sidebar {
      width: 250px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform .25s ease;
    }
    .sidebar-header {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 8px; }
    .sidebar-actions { padding: 12px; border-top: 1px solid var(--border); }

    .root-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      user-select: none;
      font-size: 14px;
    }
    .root-item:hover { background: var(--card-hover); }
    .root-item.active { background: var(--accent); color: #fff; }

    /* el-tree 自定义 */
    .tree-node {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding-right: 4px;
    }
    .tree-node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .tree-node .menu-btn {
      opacity: 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .tree-node:hover .menu-btn { opacity: 1; }
    .tree-node .menu-btn:hover { background: var(--card-hover); color: var(--text); }
    .el-tree-node__content { height: 36px; }
    .el-tree-node__content:hover { background: var(--card-hover); }
    .el-tree-node.is-current > .el-tree-node__content { background: rgba(64,158,255,.15); }
    .el-tree { background: transparent; color: var(--text); }
    .el-tree-node__expand-icon { color: var(--text-dim); }

    /* 主区 */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .menu-btn-header {
      display: none;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--text-dim);
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      white-space: nowrap;
    }
    .breadcrumb::-webkit-scrollbar { display: none; }
    .crumb { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .crumb:hover { background: var(--card-hover); color: var(--text); }
    .crumb.current { color: var(--text); font-weight: 600; cursor: default; }
    .crumb.current:hover { background: transparent; }
    .crumb-sep { color: var(--text-dim); opacity: .5; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .app-body { flex: 1; overflow-y: auto; padding: 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .cell {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      position: relative;
    }
    .cell:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .cell .thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #121826;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }
    .cell .meta { padding: 6px 8px; }
    .cell .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell .size { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .cell .op-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      opacity: 0;
      transition: opacity .15s;
      border: none;
      background: rgba(0,0,0,.5);
      color: #fff;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 13px;
    }
    .cell:hover .op-btn { opacity: 1; }

    .list-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--card);
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .list-row .icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
    .list-row .lname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .list-row .lsize { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

    .empty { text-align: center; color: var(--text-dim); padding: 60px 0; }
    .empty .big { font-size: 50px; }

    .player-dialog .el-dialog__body { padding: 0; }
    video, audio { width: 100%; display: block; }
    .video-wrap { background: #000; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 99;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.show { display: block; }
      .menu-btn-header { display: inline-block; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
      .app-body { padding: 12px; }
      .app-header { padding: 10px 12px; }
      .breadcrumb { font-size: 12px; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/static/vue.global.prod.js"></script>
<script src="/static/element-plus.full.min.js"></script>
<script>
if (typeof Vue === 'undefined') {
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#f56c6c;font-size:16px;">Vue.js 加载失败</div>';
  throw new Error('Vue not loaded');
}
if (typeof ElementPlus === 'undefined') {
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#f56c6c;font-size:16px;">Element Plus 加载失败</div>';
  throw new Error('ElementPlus not loaded');
}

const { createApp, ref, computed, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

const TEMPLATE = `
  <div v-if="!unlocked" class="lock-wrap">
    <div class="lock-card">
      <div class="lock-icon">🔐</div>
      <div class="lock-title">{{ initialized ? '解锁保险箱' : '创建保险箱' }}</div>
      <div class="lock-sub">{{ initialized ? '输入密码以查看加密文件' : '首次使用，请设置一个密码' }}</div>
      <el-form @submit.prevent>
        <el-form-item>
          <el-input v-model="password" type="password" show-password size="large"
                    :placeholder="initialized ? '密码' : '设置密码（至少 8 位）'"
                    @keyup.enter="initialized ? doUnlock() : doInit()" />
        </el-form-item>
        <el-form-item v-if="!initialized">
          <el-input v-model="password2" type="password" show-password size="large"
                    placeholder="确认密码" @keyup.enter="doInit()" />
        </el-form-item>
        <el-form-item>
          <el-button type="primary" size="large" style="width:100%"
                     :loading="busy" @click="initialized ? doUnlock() : doInit()">
            {{ initialized ? '解锁' : '创建并进入' }}
          </el-button>
        </el-form-item>
      </el-form>
      <div v-if="err" style="color:#f56c6c; font-size:13px; margin-top:14px;">{{ err }}</div>
      <div v-if="!initialized" style="color:var(--text-dim); font-size:12px; margin-top:16px; line-height:1.6;">
        ⚠️ 密码是唯一钥匙，忘记将无法找回（数据将永久不可读）。
      </div>
    </div>
  </div>

  <div v-else class="app-shell">
    <div :class="['sidebar', sidebarOpen ? 'open' : '']">
      <div class="sidebar-header">🔐 保险箱</div>
      <div class="sidebar-body">
        <div :class="['root-item', currentFolderId === '' ? 'active' : '']" @click="navigateFolder('')">
          <span>📂 全部文件</span>
        </div>
        <el-tree
          v-if="foldersLoaded"
          :data="folderTree"
          node-key="id"
          :default-expanded-keys="allFolderIds"
          :expand-on-click-node="false"
          :highlight-current="true"
          :current-node-key="currentFolderId"
          @node-click="onTreeNodeClick"
        >
          <template #default="{ node, data }">
            <div class="tree-node" @click.stop="navigateFolder(data.id)">
              <span>📁</span>
              <span class="name">{{ node.label }}</span>
              <el-dropdown trigger="click" @command="(cmd) => folderCommand(cmd, data)" @click.stop>
                <button class="menu-btn" @click.stop>⋯</button>
                <template #dropdown>
                  <el-dropdown-menu>
                    <el-dropdown-item command="open">打开</el-dropdown-item>
                    <el-dropdown-item command="new">新建子文件夹</el-dropdown-item>
                    <el-dropdown-item command="rename" divided>重命名</el-dropdown-item>
                    <el-dropdown-item command="move">移动到...</el-dropdown-item>
                    <el-dropdown-item command="copy">复制到...</el-dropdown-item>
                    <el-dropdown-item command="delete" divided>删除</el-dropdown-item>
                  </el-dropdown-menu>
                </template>
              </el-dropdown>
            </div>
          </template>
        </el-tree>
      </div>
      <div class="sidebar-actions">
        <el-button size="small" style="width:100%" @click="newFolderIn(currentFolderId)">+ 新建文件夹</el-button>
      </div>
    </div>
    <div :class="['sidebar-backdrop', sidebarOpen ? 'show' : '']" @click="sidebarOpen = false"></div>

    <div class="main">
      <div class="app-header">
        <button class="menu-btn-header" @click="sidebarOpen = !sidebarOpen">☰</button>
        <div class="breadcrumb">
          <span class="crumb" @click="navigateFolder('')">根目录</span>
          <template v-for="(crumb, idx) in breadcrumbItems" :key="crumb.id">
            <span class="crumb-sep">/</span>
            <span :class="['crumb', idx === breadcrumbItems.length - 1 ? 'current' : '']" @click="navigateFolder(crumb.id)">{{ crumb.name }}</span>
          </template>
        </div>
        <div class="header-actions">
          <el-radio-group v-model="viewMode" size="small">
            <el-radio-button value="grid">宫格</el-radio-button>
            <el-radio-button value="list">列表</el-radio-button>
          </el-radio-group>
          <el-button size="small" @click="refresh">刷新</el-button>
          <el-button type="primary" size="small" @click="uploadVisible = true">上传</el-button>
          <el-button size="small" @click="doLock">锁定</el-button>
        </div>
      </div>

      <div class="app-body">
        <div v-if="viewMode === 'grid'" class="grid">
          <div v-for="f in files" :key="f.id" class="cell">
            <el-image v-if="isImg(f)" class="thumb" :src="thumbUrl(f)"
                      :preview-src-list="imgPreviewList" :initial-index="imgIndexOf(f.id)"
                      preview-teleported fit="cover" lazy>
              <template #error><div class="thumb">🖼️</div></template>
            </el-image>
            <div v-else class="thumb" @click="open(f)">{{ iconFor(f.mime) }}</div>
            <div class="meta" @click="open(f)">
              <div class="name" :title="f.name">{{ f.name }}</div>
              <div class="size">{{ fmtSize(f.size) }}</div>
            </div>
            <el-dropdown trigger="click" @command="(cmd) => fileCommand(cmd, f)" @click.stop>
              <button class="op-btn" @click.stop>⋯</button>
              <template #dropdown>
                <el-dropdown-menu>
                  <el-dropdown-item command="open">打开</el-dropdown-item>
                  <el-dropdown-item command="copy" divided>复制到...</el-dropdown-item>
                  <el-dropdown-item command="move">移动到...</el-dropdown-item>
                  <el-dropdown-item command="delete" divided>删除</el-dropdown-item>
                </el-dropdown-menu>
              </template>
            </el-dropdown>
          </div>
        </div>
        <div v-else>
          <div v-for="f in files" :key="f.id" class="list-row" @click="open(f)">
            <div class="icon">{{ iconFor(f.mime) }}</div>
            <div class="lname">{{ f.name }}</div>
            <div class="lsize">{{ fmtSize(f.size) }}</div>
            <el-button size="small" text @click.stop="copyFileTo(f)">复制</el-button>
            <el-button size="small" text @click.stop="moveFileTo(f)">移动</el-button>
            <el-button size="small" type="danger" text @click.stop="del(f)">删除</el-button>
          </div>
        </div>
        <div v-if="files.length === 0" class="empty">
          <div class="big">📂</div>
          <div style="margin-top:12px;">{{ currentFolderId ? '此文件夹为空' : '保险箱是空的，点击右上角「上传」添加文件' }}</div>
        </div>
      </div>

      <el-dialog v-model="playerVisible" :title="playerName" class="player-dialog" width="760px" destroy-on-close>
        <div class="video-wrap">
          <video v-if="isVideo" :src="playerUrl" controls autoplay style="max-height:70vh;"></video>
          <audio v-else :src="playerUrl" controls autoplay style="width:100%; padding:20px;"></audio>
        </div>
      </el-dialog>

      <el-dialog v-model="uploadVisible" :title="'上传到 ' + (currentFolderName || '根目录')" width="480px">
        <el-upload drag multiple :auto-upload="false" :limit="20" :on-change="onPick" :show-file-list="true">
          <div style="font-size:44px;">📤</div>
          <div style="margin-top:8px;">拖拽文件到此处，或点击选择</div>
        </el-upload>
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="uploadVisible=false">取消</el-button>
          <el-button type="primary" :loading="uploading" @click="doUpload">开始上传</el-button>
        </div>
      </el-dialog>

      <!-- 新建文件夹 -->
      <el-dialog v-model="newFolderVisible" :title="newFolderParent ? '新建子文件夹' : '新建文件夹'" width="360px">
        <el-input v-model="newFolderName" placeholder="文件夹名" @keyup.enter="createFolder" />
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="newFolderVisible=false">取消</el-button>
          <el-button type="primary" @click="createFolder">创建</el-button>
        </div>
      </el-dialog>

      <!-- 重命名文件夹 -->
      <el-dialog v-model="renameVisible" title="重命名文件夹" width="360px">
        <el-input v-model="renameValue" @keyup.enter="doRename" />
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="renameVisible=false">取消</el-button>
          <el-button type="primary" @click="doRename">确定</el-button>
        </div>
      </el-dialog>

      <!-- 移动/复制到 -->
      <el-dialog v-model="transferVisible" :title="transferTitle" width="400px">
        <el-select v-model="transferTarget" placeholder="选择目标文件夹" style="width:100%;" filterable>
          <el-option label="📂 根目录" value="" />
          <el-option v-for="f in transferOptions" :key="f.id" :label="'📁 ' + f.path" :value="f.id" />
        </el-select>
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="transferVisible=false">取消</el-button>
          <el-button type="primary" :loading="transferBusy" @click="doTransfer">确定</el-button>
        </div>
      </el-dialog>
    </div>
  </div>
`;

const app = createApp({
  template: TEMPLATE,
  setup() {
    const initialized = ref(false);
    const unlocked = ref(false);
    const password = ref('');
    const password2 = ref('');
    const busy = ref(false);
    const err = ref('');

    const folders = ref([]);
    const files = ref([]);
    const currentFolderId = ref('');
    const viewMode = ref('grid');
    const foldersLoaded = ref(false);

    const uploadVisible = ref(false);
    const uploading = ref(false);
    const pickedFiles = ref([]);

    const playerVisible = ref(false);
    const playerName = ref('');
    const playerUrl = ref('');
    const isVideo = ref(false);

    const newFolderVisible = ref(false);
    const newFolderName = ref('');
    const newFolderParent = ref('');
    const renameVisible = ref(false);
    const renameValue = ref('');
    const renameTargetId = ref('');

    const transferVisible = ref(false);
    const transferBusy = ref(false);
    const transferMode = ref('move');   // 'move' | 'copy'
    const transferType = ref('file');   // 'file' | 'folder'
    const transferSourceId = ref('');
    const transferTarget = ref('');

    const sidebarOpen = ref(false);

    // 树形数据
    const folderTree = computed(() => {
      const map = {};
      folders.value.forEach(f => { map[f.id] = { id: f.id, label: f.name, parent_id: f.parent_id, children: [] }; });
      const roots = [];
      folders.value.forEach(f => {
        const node = map[f.id];
        if (f.parent_id && map[f.parent_id]) map[f.parent_id].children.push(node);
        else roots.push(node);
      });
      return roots;
    });

    const allFolderIds = computed(() => folders.value.map(f => f.id));

    const breadcrumbItems = computed(() => {
      const items = [];
      let cur = currentFolderId.value;
      while (cur) {
        const f = folders.value.find(x => x.id === cur);
        if (!f) break;
        items.unshift({ id: f.id, name: f.name });
        cur = f.parent_id;
      }
      return items;
    });

    const currentFolderName = computed(() => {
      const f = folders.value.find(x => x.id === currentFolderId.value);
      return f ? f.name : '';
    });

    // 移动/复制目标选项（排除源自身，含全路径）
    const transferOptions = computed(() => {
      const exclude = transferSourceId.value;
      return folders.value
        .filter(f => f.id !== exclude)
        .map(f => ({ id: f.id, path: folderPath(f) }));
    });

    const transferTitle = computed(() => {
      const verb = transferMode.value === 'move' ? '移动' : '复制';
      const noun = transferType.value === 'folder' ? '文件夹' : '文件';
      return `${verb}${noun}到...`;
    });

    const imgPreviewList = computed(() =>
      files.value.filter(x => x.mime.startsWith('image/')).map(x => '/api/file/' + x.id)
    );

    function folderPath(f) {
      const parts = [f.name];
      let cur = f.parent_id;
      while (cur) {
        const p = folders.value.find(x => x.id === cur);
        if (!p) break;
        parts.unshift(p.name);
        cur = p.parent_id;
      }
      return parts.join(' / ');
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: 'include',
        headers: opts.body ? { 'Content-Type': 'application/json' } : {},
        ...opts,
      });
      if (res.status === 401) { unlocked.value = false; throw new Error('未解锁'); }
      if (!res.ok) {
        let detail = '请求失败';
        try { detail = (await res.json()).detail || detail; } catch (e) {}
        throw new Error(detail);
      }
      return res.json();
    }

    async function checkStatus() {
      try {
        const s = await fetch('/api/status', { credentials: 'include' }).then(r => r.json());
        initialized.value = s.initialized;
        try {
          await api('/api/folders');
          unlocked.value = true;
          await refresh();
        } catch (e) { unlocked.value = false; }
      } catch (e) {}
    }

    async function doInit() {
      err.value = '';
      if (password.value.length < 8) { err.value = '密码至少 8 位'; return; }
      if (password.value !== password2.value) { err.value = '两次密码不一致'; return; }
      busy.value = true;
      try {
        await api('/api/init', { method: 'POST', body: JSON.stringify({ password: password.value }) });
        await doUnlock();
      } catch (e) { err.value = e.message; }
      finally { busy.value = false; }
    }

    async function doUnlock() {
      err.value = '';
      busy.value = true;
      try {
        await api('/api/unlock', { method: 'POST', body: JSON.stringify({ password: password.value }) });
        password.value = '';
        password2.value = '';
        unlocked.value = true;
        await refresh();
      } catch (e) { err.value = e.message; }
      finally { busy.value = false; }
    }

    async function doLock() {
      try { await api('/api/lock', { method: 'POST' }); } catch (e) {}
      unlocked.value = false;
      files.value = [];
      folders.value = [];
      foldersLoaded.value = false;
      currentFolderId.value = '';
      try {
        const s = await fetch('/api/status', { credentials: 'include' }).then(r => r.json());
        initialized.value = s.initialized;
      } catch (e) {}
    }

    async function refresh() {
      try {
        const [fr, fl] = await Promise.all([
          api('/api/folders'),
          api('/api/files?folder_id=' + encodeURIComponent(currentFolderId.value)),
        ]);
        folders.value = fr.folders || [];
        files.value = fl.files || [];
        foldersLoaded.value = true;
      } catch (e) { if (e.message === '未解锁') unlocked.value = false; }
    }

    function navigateFolder(id) {
      currentFolderId.value = id || '';
      sidebarOpen.value = false;
      refresh();
    }

    function onTreeNodeClick(data) {
      navigateFolder(data.id);
    }

    function newFolderIn(parentId) {
      newFolderParent.value = parentId || '';
      newFolderName.value = '';
      newFolderVisible.value = true;
    }

    async function createFolder() {
      const name = newFolderName.value.trim();
      if (!name) { ElMessage.warning('请输入文件夹名'); return; }
      try {
        await api('/api/folders', { method: 'POST', body: JSON.stringify({ name, parent_id: newFolderParent.value }) });
        newFolderName.value = '';
        newFolderVisible.value = false;
        ElMessage.success('已创建');
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    async function folderCommand(cmd, data) {
      if (cmd === 'open') { navigateFolder(data.id); return; }
      if (cmd === 'new') { newFolderIn(data.id); return; }
      if (cmd === 'rename') {
        renameTargetId.value = data.id;
        renameValue.value = data.label;
        renameVisible.value = true;
        return;
      }
      if (cmd === 'move' || cmd === 'copy') {
        transferMode.value = cmd;
        transferType.value = 'folder';
        transferSourceId.value = data.id;
        transferTarget.value = '';
        transferVisible.value = true;
        return;
      }
      if (cmd === 'delete') {
        try {
          await ElMessageBox.confirm(`删除文件夹「${data.label}」？其子文件夹会一并删除，文件将上浮到上级目录。`, '删除', { type: 'warning' });
        } catch (e) { return; }
        try {
          await api('/api/folders/' + data.id, { method: 'DELETE' });
          ElMessage.success('已删除');
          if (currentFolderId.value === data.id) navigateFolder('');
          else await refresh();
        } catch (e) { ElMessage.error(e.message); }
      }
    }

    async function doRename() {
      const name = renameValue.value.trim();
      if (!name) return;
      try {
        await api('/api/folders/' + renameTargetId.value, { method: 'PATCH', body: JSON.stringify({ name }) });
        renameVisible.value = false;
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    function fileCommand(cmd, f) {
      if (cmd === 'open') { open(f); return; }
      if (cmd === 'copy') { copyFileTo(f); return; }
      if (cmd === 'move') { moveFileTo(f); return; }
      if (cmd === 'delete') { del(f); return; }
    }

    function copyFileTo(f) {
      transferMode.value = 'copy';
      transferType.value = 'file';
      transferSourceId.value = f.id;
      transferTarget.value = '';
      transferVisible.value = true;
    }

    function moveFileTo(f) {
      transferMode.value = 'move';
      transferType.value = 'file';
      transferSourceId.value = f.id;
      transferTarget.value = '';
      transferVisible.value = true;
    }

    async function doTransfer() {
      transferBusy.value = true;
      try {
        if (transferType.value === 'file') {
          const url = transferMode.value === 'move'
            ? '/api/file/' + transferSourceId.value + '/move'
            : '/api/file/' + transferSourceId.value + '/copy';
          await api(url, { method: transferMode.value === 'move' ? 'PATCH' : 'POST', body: JSON.stringify({ folder_id: transferTarget.value }) });
        } else {
          const url = transferMode.value === 'move'
            ? '/api/folders/' + transferSourceId.value + '/move'
            : '/api/folders/' + transferSourceId.value + '/copy';
          await api(url, { method: transferMode.value === 'move' ? 'PATCH' : 'POST', body: JSON.stringify({ parent_id: transferTarget.value }) });
        }
        transferVisible.value = false;
        ElMessage.success(transferMode.value === 'move' ? '已移动' : '已复制');
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
      finally { transferBusy.value = false; }
    }

    function onPick(file) { pickedFiles.value.push(file.raw); }

    async function doUpload() {
      if (pickedFiles.value.length === 0) return;
      uploading.value = true;
      let ok = 0, fail = 0;
      for (const f of pickedFiles.value) {
        try {
          const fd = new FormData();
          fd.append('file', f);
          const url = '/api/upload?folder_id=' + encodeURIComponent(currentFolderId.value);
          const res = await fetch(url, { method: 'POST', body: fd, credentials: 'include' });
          if (res.ok) ok++; else fail++;
        } catch (e) { fail++; }
      }
      uploading.value = false;
      pickedFiles.value = [];
      uploadVisible.value = false;
      ElMessage.success(`上传完成：成功 ${ok} 个` + (fail ? `，失败 ${fail} 个` : ''));
      await refresh();
    }

    function isImg(f) { return f.mime.startsWith('image/'); }
    function thumbUrl(f) { return '/api/file/' + f.id + '/thumb'; }
    function imgIndexOf(id) {
      const imgs = files.value.filter(x => x.mime.startsWith('image/'));
      const i = imgs.findIndex(x => x.id === id);
      return i < 0 ? 0 : i;
    }

    function iconFor(mime) {
      if (mime.startsWith('video/')) return '🎬';
      if (mime.startsWith('audio/')) return '🎵';
      if (mime.startsWith('image/')) return '🖼️';
      if (mime.includes('pdf')) return '📄';
      if (mime.includes('zip') || mime.includes('rar') || mime.includes('7z')) return '📦';
      if (mime.includes('text') || mime.includes('json')) return '📝';
      return '📁';
    }

    function open(f) {
      if (f.mime.startsWith('video/') || f.mime.startsWith('audio/')) {
        playerName.value = f.name;
        playerUrl.value = '/api/file/' + f.id;
        isVideo.value = f.mime.startsWith('video/');
        playerVisible.value = true;
      } else {
        window.open('/api/file/' + f.id, '_blank');
      }
    }

    async function del(f) {
      try {
        await ElMessageBox.confirm(`确定删除「${f.name}」？此操作不可恢复。`, '删除', { type: 'warning' });
      } catch (e) { return; }
      try {
        await api('/api/file/' + f.id, { method: 'DELETE' });
        ElMessage.success('已删除');
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    function fmtSize(n) {
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
      return (n / 1073741824).toFixed(2) + ' GB';
    }

    onMounted(checkStatus);

    return {
      initialized, unlocked, password, password2, busy, err,
      folders, files, currentFolderId, currentFolderName, breadcrumbItems,
      folderTree, allFolderIds, foldersLoaded,
      viewMode, uploadVisible, uploading, pickedFiles,
      playerVisible, playerName, playerUrl, isVideo,
      newFolderVisible, newFolderName, newFolderParent,
      renameVisible, renameValue,
      transferVisible, transferBusy, transferTitle, transferOptions, transferTarget,
      sidebarOpen, imgPreviewList,
      doInit, doUnlock, doLock, refresh, navigateFolder, onTreeNodeClick,
      newFolderIn, createFolder, folderCommand, doRename,
      fileCommand, copyFileTo, moveFileTo, doTransfer, onPick, doUpload,
      isImg, thumbUrl, imgIndexOf, iconFor, open, del, fmtSize,
    };
  },
});
app.use(ElementPlus);
app.mount('#app');
</script>
</body>
</html>
