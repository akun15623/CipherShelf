<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>保险箱 · Secure Vault</title>
  <link rel="stylesheet" href="/static/element-plus.css">
  <style>
    :root {
      --bg: #0f1420;
      --card: #1a2130;
      --card-hover: #232b3d;
      --border: #262f42;
      --text: #e6e8ee;
      --text-dim: #8a93a6;
      --accent: #409eff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============ 锁屏 ============ */
    .lock-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .lock-card { width: 100%; max-width: 400px; background: var(--card); border-radius: 16px; padding: 40px 32px; text-align: center; }
    .lock-icon { font-size: 56px; margin-bottom: 8px; }
    .lock-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .lock-sub { color: var(--text-dim); font-size: 13px; margin-bottom: 28px; }

    /* ============ 主布局 ============ */
    .app-shell { display: flex; height: 100vh; }

    .sidebar {
      width: 250px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform .25s ease;
    }
    .sidebar-header {
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 8px; }
    .sidebar-actions { padding: 12px; border-top: 1px solid var(--border); }

    .root-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      user-select: none;
      font-size: 14px;
    }
    .root-item:hover { background: var(--card-hover); }
    .root-item.active { background: var(--accent); color: #fff; }

    /* el-tree 自定义 */
    .tree-node {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      padding-right: 4px;
    }
    .tree-node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .tree-node .menu-btn {
      opacity: 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .tree-node:hover .menu-btn { opacity: 1; }
    .tree-node .menu-btn:hover { background: var(--card-hover); color: var(--text); }
    .el-tree-node__content { height: 36px; }
    .el-tree-node__content:hover { background: var(--card-hover); }
    .el-tree-node.is-current > .el-tree-node__content { background: rgba(64,158,255,.15); }
    .el-tree { background: transparent; color: var(--text); }
    .el-tree-node__expand-icon { color: var(--text-dim); }

    /* 主区 */
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .app-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .menu-btn-header {
      display: none;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      color: var(--text-dim);
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      white-space: nowrap;
    }
    .breadcrumb::-webkit-scrollbar { display: none; }
    .crumb { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .crumb:hover { background: var(--card-hover); color: var(--text); }
    .crumb.current { color: var(--text); font-weight: 600; cursor: default; }
    .crumb.current:hover { background: transparent; }
    .crumb-sep { color: var(--text-dim); opacity: .5; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .app-body { flex: 1; overflow-y: auto; padding: 16px; }

    .body-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .body-toolbar .count { color: var(--text-dim); font-size: 12px; }
    .batch-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .cell {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      position: relative;
    }
    .cell:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.4); }
    .cell .thumb {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #121826;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }
    .cell .meta { padding: 6px 8px; }
    .cell .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell .size { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
    .cell .op-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      opacity: 0;
      transition: opacity .15s;
      border: none;
      background: rgba(0,0,0,.5);
      color: #fff;
      cursor: pointer;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      font-size: 13px;
    }
    .cell:hover .op-btn { opacity: 1; }
    .cell .sel { position: absolute; top: 4px; left: 4px; z-index: 2; }
    .cell .sel .el-checkbox__inner { background: rgba(0,0,0,.45); border-color: #fff; }
    .cell .sel.is-checked .el-checkbox__inner { background: var(--accent); border-color: var(--accent); }
    .folder-cell .thumb { font-size: 52px; }

    .list-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: var(--card);
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
    }
    .list-row:hover { background: var(--card-hover); }
    .list-row .el-checkbox { flex-shrink: 0; }
    .list-row .icon { font-size: 22px; width: 32px; text-align: center; flex-shrink: 0; }
    .list-row .lname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .list-row .lsize { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

    .empty { text-align: center; color: var(--text-dim); padding: 60px 0; }
    .empty .big { font-size: 50px; }

    video, audio { width: 100%; display: block; }

    .import-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .import-list { max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
    .import-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .import-row:hover { background: var(--card-hover); }
    .import-row .iname { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .import-row .isize { color: var(--text-dim); font-size: 11px; flex-shrink: 0; }

    /* ============ 全屏媒体预览（横屏自适应 + 上下滑切换） ============ */
    .media-preview { position: fixed; inset: 0; background: rgba(0,0,0,.95); z-index: 2000; display: flex; flex-direction: column; }
    .mp-topbar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(0,0,0,.55); }
    .mp-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mp-count { color: #bbb; font-size: 13px; flex-shrink: 0; }
    .mp-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .mp-actions button, .mp-actions a {
      width: 34px; height: 34px; border: none; border-radius: 6px;
      background: rgba(255,255,255,.12); color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; text-decoration: none;
    }
    .mp-actions button:hover, .mp-actions a:hover { background: rgba(255,255,255,.25); }
    .mp-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .mp-media { max-width: 100vw; max-height: calc(100vh - 100px); width: auto; height: auto; object-fit: contain; }
    .mp-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 44px; height: 44px; border: none; border-radius: 50%;
      background: rgba(0,0,0,.45); color: #fff; font-size: 28px; cursor: pointer; z-index: 2;
    }
    .mp-nav:hover { background: rgba(0,0,0,.7); }
    .mp-nav.prev { left: 12px; }
    .mp-nav.next { right: 12px; }
    .mp-hint { text-align: center; padding: 8px; color: #777; font-size: 12px; }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 99;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .sidebar-backdrop.show { display: block; }
      .menu-btn-header { display: inline-block; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
      .app-body { padding: 12px; }
      .app-header { padding: 10px 12px; }
      .breadcrumb { font-size: 12px; }
      .mp-nav { width: 36px; height: 36px; font-size: 22px; }
    }
    @media (orientation: landscape) and (max-height: 480px) {
      .mp-topbar { padding: 6px 12px; }
      .mp-hint { display: none; }
      .mp-media { max-height: 100vh; }
    }
  </style>
</head>
<body>
<div id="app"></div>

<script src="/static/vue.global.prod.js"></script>
<script src="/static/element-plus.full.min.js"></script>
<script>
if (typeof Vue === 'undefined') {
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#f56c6c;font-size:16px;">Vue.js 加载失败</div>';
  throw new Error('Vue not loaded');
}
if (typeof ElementPlus === 'undefined') {
  document.getElementById('app').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;color:#f56c6c;font-size:16px;">Element Plus 加载失败</div>';
  throw new Error('ElementPlus not loaded');
}

const { createApp, ref, computed, onMounted } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

const TEMPLATE = `

  <div v-else class="app-shell">

            <el-checkbox :model-value="importAllSelected" @change="toggleImportAll">全选</el-checkbox>
            <el-checkbox v-model="importDeleteSource">加密后删除原文件</el-checkbox>
            <el-button size="small" @click="loadImport">刷新</el-button>
          </div>
          <div class="import-list">
            <div v-for="it in importItems" :key="it.rel" class="import-row" @click="toggleImport(it.rel)">
              <el-checkbox :model-value="importSelected.includes(it.rel)" @click.stop @change="toggleImport(it.rel)" />
              <span class="iname" :title="it.rel">{{ it.rel }}</span>
              <span class="isize">{{ fmtSize(it.size) }}</span>
            </div>
            <div v-if="importItems.length === 0" class="empty" style="padding:24px 0;">导入目录为空</div>
          </div>
          <div style="margin-top:8px; color:var(--text-dim); font-size:12px;">
            将加密到：{{ currentFolderName || '根目录' }}（子目录结构会保留）
          </div>
          <div style="margin-top:14px; text-align:right;">
            <el-button @click="importVisible=false">取消</el-button>
            <el-button type="primary" :loading="importBusy" @click="doImport">加密到保险箱</el-button>
          </div>
        </div>
      </el-dialog>

      <!-- 新建文件夹 -->
      <el-dialog v-model="newFolderVisible" :title="newFolderParent ? '新建子文件夹' : '新建文件夹'" width="360px">
        <el-input v-model="newFolderName" placeholder="文件夹名" @keyup.enter="createFolder" />
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="newFolderVisible=false">取消</el-button>
          <el-button type="primary" @click="createFolder">创建</el-button>
        </div>
      </el-dialog>

      <!-- 重命名文件夹 -->
      <el-dialog v-model="renameVisible" title="重命名文件夹" width="360px">
        <el-input v-model="renameValue" @keyup.enter="doRename" />
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="renameVisible=false">取消</el-button>
          <el-button type="primary" @click="doRename">确定</el-button>
        </div>
      </el-dialog>

      <!-- 移动/复制到 -->
      <el-dialog v-model="transferVisible" :title="transferTitle" width="400px">
        <el-select v-model="transferTarget" placeholder="选择目标文件夹" style="width:100%;" filterable>
          <el-option label="📂 根目录" value="" />
          <el-option v-for="f in transferOptions" :key="f.id" :label="'📁 ' + f.path" :value="f.id" />
        </el-select>
        <div style="margin-top:14px; text-align:right;">
          <el-button @click="transferVisible=false">取消</el-button>
          <el-button type="primary" :loading="transferBusy" @click="doTransfer">确定</el-button>
        </div>
      </el-dialog>
    </div>
  </div>

  <!-- 全屏媒体预览：横屏自适应 + 上下滑切换 -->
  <div v-if="previewVisible" class="media-preview" @click.self="closePreview"
       @touchstart="onTouchStart" @touchend="onTouchEnd">
    <div class="mp-topbar">
      <span class="mp-name" :title="currentMedia ? currentMedia.name : ''">{{ currentMedia ? currentMedia.name : '' }}</span>
      <span class="mp-count">{{ previewIndex + 1 }} / {{ previewItems.length }}</span>
      <div class="mp-actions">
        <button title="全屏" @click="toggleFullscreen">⛶</button>
        <a v-if="currentMedia" :href="'/api/file/' + currentMedia.id" target="_blank" download :title="'下载 ' + (currentMedia.name)">⬇</a>
        <button title="关闭" @click="closePreview">✕</button>
      </div>
    </div>
    <div class="mp-stage">
      <button class="mp-nav prev" @click.stop="prevMedia">‹</button>
      <img v-if="currentMedia && isImg(currentMedia)" :src="'/api/file/' + currentMedia.id" class="mp-media" :alt="currentMedia.name" />
      <video v-else-if="currentMedia" :src="'/api/file/' + currentMedia.id" class="mp-media" controls autoplay></video>
      <button class="mp-nav next" @click.stop="nextMedia">›</button>
    </div>
    <div class="mp-hint">↑↓ / ←→ 切换 · Esc 关闭</div>
  </div>
`;

const app = createApp({
  template: TEMPLATE,
  setup() {
    const initialized = ref(false);
    const unlocked = ref(false);
    const password = ref('');
    const password2 = ref('');
    const busy = ref(false);
    const err = ref('');

    const folders = ref([]);
    const files = ref([]);
    const currentFolderId = ref('');
    const viewMode = ref('grid');
    const foldersLoaded = ref(false);

    const uploadVisible = ref(false);
    const uploading = ref(false);
    const pickedFiles = ref([]);

    const playerVisible = ref(false);
    const playerName = ref('');
    const playerUrl = ref('');

    const newFolderVisible = ref(false);
    const newFolderName = ref('');
    const newFolderParent = ref('');
    const renameVisible = ref(false);
    const renameValue = ref('');
    const renameTargetId = ref('');

    const transferVisible = ref(false);
    const transferBusy = ref(false);
    const transferMode = ref('move');          // 'move' | 'copy'
    const transferSources = ref([]);           // [{type:'file'|'folder', id}]
    const transferTarget = ref('');

    const importVisible = ref(false);
    const importLoading = ref(false);
    const importBusy = ref(false);
    const importAvailable = ref(false);
    const importRoot = ref('');
    const importItems = ref([]);
    const importSelected = ref([]);
    const importDeleteSource = ref(false);

    const selected = ref([]);                  // 选中的文件 id
    const selectedFolders = ref([]);           // 选中的文件夹 id

    const previewVisible = ref(false);
    const previewItems = ref([]);              // [{id,name,mime}]
    const previewIndex = ref(0);

    const sidebarOpen = ref(false);

    // 树形数据
    const folderTree = computed(() => {
      const map = {};
      folders.value.forEach(f => { map[f.id] = { id: f.id, label: f.name, parent_id: f.parent_id, children: [] }; });
      const roots = [];
      folders.value.forEach(f => {
        const node = map[f.id];
        if (f.parent_id && map[f.parent_id]) map[f.parent_id].children.push(node);
        else roots.push(node);
      });
      return roots;
    });

    const allFolderIds = computed(() => folders.value.map(f => f.id));

    const foldersInCurrent = computed(() => folders.value.filter(f => f.parent_id === currentFolderId.value));

    const breadcrumbItems = computed(() => {
      const items = [];
      let cur = currentFolderId.value;
      while (cur) {
        const f = folders.value.find(x => x.id === cur);
        if (!f) break;
        items.unshift({ id: f.id, name: f.name });
        cur = f.parent_id;
      }
      return items;
    });

    const currentFolderName = computed(() => {
      const f = folders.value.find(x => x.id === currentFolderId.value);
      return f ? f.name : '';
    });

    function getDescendantIds(id) {
      const out = [];
      const walk = pid => folders.value.filter(f => f.parent_id === pid).forEach(f => { out.push(f.id); walk(f.id); });
      walk(id);
      return out;
    }

    // 移动/复制目标选项（排除源文件夹及其子孙，防循环）
    const transferExcluded = computed(() => {
      const ex = new Set();
      transferSources.value.forEach(s => {
        if (s.type === 'folder') { ex.add(s.id); getDescendantIds(s.id).forEach(x => ex.add(x)); }
      });
      return ex;
    });

    const transferOptions = computed(() =>
      folders.value.filter(f => !transferExcluded.value.has(f.id)).map(f => ({ id: f.id, path: folderPath(f) }))
    );

    const transferTitle = computed(() => {
      const verb = transferMode.value === 'move' ? '移动' : '复制';
      const n = transferSources.value.length;
      if (n > 1) return `批量${verb}（${n} 项）到...`;
      const t = transferSources.value[0]?.type === 'folder' ? '文件夹' : '文件';
      return `${verb}${t}到...`;
    });

    const mediaItems = computed(() =>
      files.value.filter(f => f.mime.startsWith('image/') || f.mime.startsWith('video/'))
    );

    const currentMedia = computed(() => previewItems.value[previewIndex.value] || null);

    const hasSelection = computed(() => selected.value.length + selectedFolders.value.length > 0);

    const allSelected = computed(() => {
      const n = files.value.length + foldersInCurrent.value.length;
      return n > 0 && selected.value.length === files.value.length && selectedFolders.value.length === foldersInCurrent.value.length;
    });

    const importAllSelected = computed(() =>
      importItems.value.length > 0 && importSelected.value.length === importItems.value.length
    );

    function folderPath(f) {
      const parts = [f.name];
      let cur = f.parent_id;
      while (cur) {
        const p = folders.value.find(x => x.id === cur);
        if (!p) break;
        parts.unshift(p.name);
        cur = p.parent_id;
      }
      return parts.join(' / ');
    }

    function folderName(d) { return d.label || d.name; }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: 'include',
        headers: opts.body ? { 'Content-Type': 'application/json' } : {},
        ...opts,
      });
      if (res.status === 401) { unlocked.value = false; throw new Error('未解锁'); }
      if (!res.ok) {
        let detail = '请求失败';
        try { detail = (await res.json()).detail || detail; } catch (e) {}
        throw new Error(detail);
      }
      return res.json();
    }

    async function checkStatus() {
      try {
        const s = await fetch('/api/status', { credentials: 'include' }).then(r => r.json());
        initialized.value = s.initialized;
        try {
          await api('/api/folders');
          unlocked.value = true;
          await refresh();
        } catch (e) { unlocked.value = false; }
      } catch (e) {}
    }

    async function doInit() {
      err.value = '';
      if (password.value.length < 8) { err.value = '密码至少 8 位'; return; }
      if (password.value !== password2.value) { err.value = '两次密码不一致'; return; }
      busy.value = true;
      try {
        await api('/api/init', { method: 'POST', body: JSON.stringify({ password: password.value }) });
        await doUnlock();
      } catch (e) { err.value = e.message; }
      finally { busy.value = false; }
    }

    async function doUnlock() {
      err.value = '';
      busy.value = true;
      try {
        await api('/api/unlock', { method: 'POST', body: JSON.stringify({ password: password.value }) });
        password.value = '';
        password2.value = '';
        unlocked.value = true;
        await refresh();
      } catch (e) { err.value = e.message; }
      finally { busy.value = false; }
    }

    async function doLock() {
      try { await api('/api/lock', { method: 'POST' }); } catch (e) {}
      unlocked.value = false;
      files.value = [];
      folders.value = [];
      foldersLoaded.value = false;
      currentFolderId.value = '';
      clearSelection();
      try {
        const s = await fetch('/api/status', { credentials: 'include' }).then(r => r.json());
        initialized.value = s.initialized;
      } catch (e) {}
    }

    async function refresh() {
      try {
        const [fr, fl] = await Promise.all([
          api('/api/folders'),
          api('/api/files?folder_id=' + encodeURIComponent(currentFolderId.value)),
        ]);
        folders.value = fr.folders || [];
        files.value = fl.files || [];
        foldersLoaded.value = true;
        clearSelection();
      } catch (e) { if (e.message === '未解锁') unlocked.value = false; }
    }

    function navigateFolder(id) {
      currentFolderId.value = id || '';
      sidebarOpen.value = false;
      refresh();
    }

    function onTreeNodeClick(data) {
      navigateFolder(data.id);
    }

    function newFolderIn(parentId) {
      newFolderParent.value = parentId || '';
      newFolderName.value = '';
      newFolderVisible.value = true;
    }

    async function createFolder() {
      const name = newFolderName.value.trim();
      if (!name) { ElMessage.warning('请输入文件夹名'); return; }
      try {
        await api('/api/folders', { method: 'POST', body: JSON.stringify({ name, parent_id: newFolderParent.value }) });
        newFolderName.value = '';
        newFolderVisible.value = false;
        ElMessage.success('已创建');
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    async function folderCommand(cmd, data) {
      if (cmd === 'open') { navigateFolder(data.id); return; }
      if (cmd === 'new') { newFolderIn(data.id); return; }
      if (cmd === 'rename') {
        renameTargetId.value = data.id;
        renameValue.value = folderName(data);
        renameVisible.value = true;
        return;
      }
      if (cmd === 'move' || cmd === 'copy') {
        openTransfer(cmd, [{ type: 'folder', id: data.id }]);
        return;
      }
      if (cmd === 'delete') {
        try {
          await ElMessageBox.confirm(`删除文件夹「${folderName(data)}」？其子文件夹会一并删除，文件将上浮到上级目录。`, '删除', { type: 'warning' });
        } catch (e) { return; }
        try {
          await api('/api/folders/' + data.id, { method: 'DELETE' });
          ElMessage.success('已删除');
          if (currentFolderId.value === data.id) navigateFolder('');
          else await refresh();
        } catch (e) { ElMessage.error(e.message); }
      }
    }

    async function doRename() {
      const name = renameValue.value.trim();
      if (!name) return;
      try {
        await api('/api/folders/' + renameTargetId.value, { method: 'PATCH', body: JSON.stringify({ name }) });
        renameVisible.value = false;
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    function fileCommand(cmd, f) {
      if (cmd === 'open') { open(f); return; }
      if (cmd === 'copy') { openTransfer('copy', [{ type: 'file', id: f.id }]); return; }
      if (cmd === 'move') { openTransfer('move', [{ type: 'file', id: f.id }]); return; }
      if (cmd === 'delete') { del(f); return; }
    }

    function openTransfer(mode, sources) {
      transferMode.value = mode;
      transferSources.value = sources;
      transferTarget.value = '';
      transferVisible.value = true;
    }

    async function doTransfer() {
      transferBusy.value = true;
      try {
        const files = transferSources.value.filter(s => s.type === 'file').map(s => s.id);
        const folders = transferSources.value.filter(s => s.type === 'folder').map(s => s.id);
        const isMove = transferMode.value === 'move';
        if (files.length === 1 && folders.length === 0) {
          await api('/api/file/' + files[0] + '/' + (isMove ? 'move' : 'copy'),
            { method: isMove ? 'PATCH' : 'POST', body: JSON.stringify({ folder_id: transferTarget.value }) });
        } else if (folders.length === 1 && files.length === 0) {
          await api('/api/folders/' + folders[0] + '/' + (isMove ? 'move' : 'copy'),
            { method: isMove ? 'PATCH' : 'POST', body: JSON.stringify({ parent_id: transferTarget.value }) });
        } else {
          await api('/api/batch/' + transferMode.value,
            { method: 'POST', body: JSON.stringify({ ids: files, folders, target: transferTarget.value }) });
        }
        transferVisible.value = false;
        ElMessage.success(isMove ? '已移动' : '已复制');
        clearSelection();
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
      finally { transferBusy.value = false; }
    }

    function onPick(file) { pickedFiles.value.push(file.raw); }

    async function doUpload() {
      if (pickedFiles.value.length === 0) return;
      uploading.value = true;
      let ok = 0, fail = 0;
      for (const f of pickedFiles.value) {
        try {
          const fd = new FormData();
          fd.append('file', f);
          const url = '/api/upload?folder_id=' + encodeURIComponent(currentFolderId.value);
          const res = await fetch(url, { method: 'POST', body: fd, credentials: 'include' });
          if (res.ok) ok++; else fail++;
        } catch (e) { fail++; }
      }
      uploading.value = false;
      pickedFiles.value = [];
      uploadVisible.value = false;
      ElMessage.success(`上传完成：成功 ${ok} 个` + (fail ? `，失败 ${fail} 个` : ''));
      await refresh();
    }

    // ---- 批量选择 ----
    function toggleIn(arr, val) {
      const i = arr.indexOf(val);
      if (i >= 0) arr.splice(i, 1); else arr.push(val);
    }
    function toggleSelect(id) { toggleIn(selected.value, id); }
    function toggleFolderSelect(id) { toggleIn(selectedFolders.value, id); }
    function toggleSelectAll(v) {
      if (v) {
        selected.value = files.value.map(f => f.id);
        selectedFolders.value = foldersInCurrent.value.map(f => f.id);
      } else { clearSelection(); }
    }
    function clearSelection() { selected.value = []; selectedFolders.value = []; }
    function selectionSources() {
      const s = selected.value.map(id => ({ type: 'file', id }));
      return s.concat(selectedFolders.value.map(id => ({ type: 'folder', id })));
    }
    function batchMove() { openTransfer('move', selectionSources()); }
    function batchCopy() { openTransfer('copy', selectionSources()); }
    function batchDownload() {
      const u = '/api/batch/download?files=' + encodeURIComponent(selected.value.join(',')) +
                '&folders=' + encodeURIComponent(selectedFolders.value.join(','));
      window.open(u, '_blank');
    }
    async function batchDelete() {
      const n = selected.value.length + selectedFolders.value.length;
      try {
        await ElMessageBox.confirm(`确定删除选中的 ${n} 项？文件将永久删除；文件夹会被移除（其中的文件上浮到上级目录）。`, '批量删除', { type: 'warning' });
      } catch (e) { return; }
      try {
        const r = await api('/api/batch/delete', { method: 'POST', body: JSON.stringify({ ids: selected.value, folders: selectedFolders.value }) });
        ElMessage.success(`已删除 ${r.files + r.folders} 项`);
        clearSelection();
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    // ---- 导入 ----
    async function loadImport() {
      importLoading.value = true;
      try {
        const r = await api('/api/import/list');
        importAvailable.value = r.available;
        importRoot.value = r.root;
        importItems.value = r.items || [];
        importSelected.value = [];
      } catch (e) { ElMessage.error(e.message); }
      finally { importLoading.value = false; }
    }
    function openImport() {
      importVisible.value = true;
      loadImport();
    }
    function toggleImport(rel) { toggleIn(importSelected.value, rel); }
    function toggleImportAll(v) {
      importSelected.value = v ? importItems.value.map(i => i.rel) : [];
    }
    async function doImport() {
      if (!importSelected.value.length) { ElMessage.warning('请先勾选要导入的文件'); return; }
      importBusy.value = true;
      try {
        const r = await api('/api/import', {
          method: 'POST',
          body: JSON.stringify({ paths: importSelected.value, folder_id: currentFolderId.value, delete_source: importDeleteSource.value }),
        });
        importVisible.value = false;
        ElMessage.success(`已加密导入 ${r.ok} 个` + (r.fail ? `，失败 ${r.fail} 个` : ''));
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
      finally { importBusy.value = false; }
    }

    function isImg(f) { return f.mime.startsWith('image/'); }
    function thumbUrl(f) { return '/api/file/' + f.id + '/thumb'; }

    function iconFor(mime) {
      if (mime.startsWith('video/')) return '🎬';
      if (mime.startsWith('audio/')) return '🎵';
      if (mime.startsWith('image/')) return '🖼️';
      if (mime.includes('pdf')) return '📄';
      if (mime.includes('zip') || mime.includes('rar') || mime.includes('7z')) return '📦';
      if (mime.includes('text') || mime.includes('json')) return '📝';
      return '📁';
    }

    function open(f) {
      if (f.mime.startsWith('image/') || f.mime.startsWith('video/')) { openMedia(f); return; }
      if (f.mime.startsWith('audio/')) {
        playerName.value = f.name;
        playerUrl.value = '/api/file/' + f.id;
        playerVisible.value = true;
        return;
      }
      window.open('/api/file/' + f.id, '_blank');
    }

    // ---- 全屏预览（横屏自适应 + 上下滑切换）----
    function openMedia(f) {
      previewItems.value = mediaItems.value;
      let idx = mediaItems.value.findIndex(x => x.id === f.id);
      if (idx < 0) { previewItems.value = [f]; idx = 0; }
      previewIndex.value = idx;
      previewVisible.value = true;
    }
    function nextMedia() { if (previewItems.value.length) previewIndex.value = (previewIndex.value + 1) % previewItems.value.length; }
    function prevMedia() { if (previewItems.value.length) previewIndex.value = (previewIndex.value - 1 + previewItems.value.length) % previewItems.value.length; }
    function closePreview() { previewVisible.value = false; }
    function toggleFullscreen() {
      const el = document.querySelector('.media-preview');
      if (!el) return;
      if (document.fullscreenElement) document.exitFullscreen && document.exitFullscreen();
      else el.requestFullscreen && el.requestFullscreen();
    }
    let tsx = 0, tsy = 0;
    function onTouchStart(e) { tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; }
    function onTouchEnd(e) {
      const dx = e.changedTouches[0].clientX - tsx;
      const dy = e.changedTouches[0].clientY - tsy;
      if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
      if (Math.abs(dy) > Math.abs(dx)) { if (dy < 0) nextMedia(); else prevMedia(); }
      else { if (dx < 0) nextMedia(); else prevMedia(); }
    }

    async function del(f) {
      try {
        await ElMessageBox.confirm(`确定删除「${f.name}」？此操作不可恢复。`, '删除', { type: 'warning' });
      } catch (e) { return; }
      try {
        await api('/api/file/' + f.id, { method: 'DELETE' });
        ElMessage.success('已删除');
        await refresh();
      } catch (e) { ElMessage.error(e.message); }
    }

    function fmtSize(n) {
      if (n < 1024) return n + ' B';
      if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
      if (n < 1073741824) return (n / 1048576).toFixed(1) + ' MB';
      return (n / 1073741824).toFixed(2) + ' GB';
    }

    onMounted(() => {
      checkStatus();
      window.addEventListener('keydown', (e) => {
        if (!previewVisible.value) return;
        if (e.key === 'Escape') closePreview();
        else if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); nextMedia(); }
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); prevMedia(); }
      });
    });

    return {
      initialized, unlocked, password, password2, busy, err,
      folders, files, currentFolderId, currentFolderName, breadcrumbItems,
      folderTree, allFolderIds, foldersLoaded, foldersInCurrent,
      viewMode, uploadVisible, uploading, pickedFiles,
      playerVisible, playerName, playerUrl,
      newFolderVisible, newFolderName, newFolderParent,
      renameVisible, renameValue,
      transferVisible, transferBusy, transferTitle, transferOptions, transferTarget,
      importVisible, importLoading, importBusy, importAvailable, importRoot, importItems, importSelected, importDeleteSource,
      importAllSelected, openImport, loadImport, toggleImport, toggleImportAll, doImport,
      selected, selectedFolders, hasSelection, allSelected,
      previewVisible, previewItems, previewIndex, currentMedia,
      sidebarOpen,
      doInit, doUnlock, doLock, refresh, navigateFolder, onTreeNodeClick,
      newFolderIn, createFolder, folderCommand, doRename,
      fileCommand, openTransfer, doTransfer, onPick, doUpload,
