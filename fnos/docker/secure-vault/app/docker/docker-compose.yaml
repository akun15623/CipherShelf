services:
  secure-vault:
    image: crpi-dberwpbq5bud3kxp.cn-chengdu.personal.cr.aliyuncs.com/akun15623/secure-vault:latest
    container_name: secure-vault
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:8080"
    environment:
      VAULT_ROOT: /data
      PORT: "8080"
      VAULT_PASSWORD: "${wizard_password}"
    volumes:
      - "${wizard_data_path}:/data"
