services:
  ciphershelf:
    image: crpi-dberwpbq5bud3kxp.cn-chengdu.personal.cr.aliyuncs.com/akun15623/ciphershelf:1.1.2
    container_name: ciphershelf
    restart: unless-stopped
    ports:
      - "${TRIM_SERVICE_PORT}:8080"
    environment:
      VAULT_ROOT: /data
      PORT: "8080"
      VAULT_PASSWORD: "${wizard_password}"
      SVAULT_COOKIE_SECURE: "0"
    volumes:
      - "${wizard_data_path}:/data"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
